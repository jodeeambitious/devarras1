<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bro's Advanced Control Center</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-side: #1c1c21;
            --bg-card: #25252f;
            --border-color: #3a3a45;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            display: flex;
            width: 750px; /* Locked size optimized for a dropdown extension window */
            height: 500px;
        }

        .input-panel {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px solid var(--border-color);
        }
        
        #cyberClock {
            font-family: 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 15px;
            text-align: center;
        }
        
        h2 { color: var(--accent); margin: 0 0 5px 0; font-size: 1.4rem; }
        .counter { color: #888; font-size: 0.85rem; margin-bottom: 15px; }

        input {
            background: var(--bg-side);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #121214;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }

        .grab-btn {
            background: #ffffff;
            color: #121214;
        }
        
        .theme-panel {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .theme-panel span { color: #888; font-size: 0.85rem; }
        .theme-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
        }

        .sidebar-links {
            width: 300px;
            background: var(--bg-side);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .sidebar-header h3 { color: #888; margin: 0 0 10px 0; }
        .search-box { width: 90%; padding: 8px; font-size: 0.85rem; }

        .link-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--accent);
        }
        .link-card a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .link-card a:hover { color: var(--accent); }
        .delete-btn { background: none; color: #ff5555; border: none; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="input-panel">
        <div id="cyberClock">00:00:00</div>
        <h2>Control Panel</h2>
        <div class="counter" id="linkCounter">Total Saved: 0 links</div>
        
        <input type="text" id="siteName" placeholder="Custom Name (Optional)">
        <input type="text" id="siteUrl" placeholder="Custom URL (Optional)">
        
        <div class="btn-group">
            <button onclick="addManualLink()">Save Custom</button>
            <button class="grab-btn" id="grabTabBtn">⚡ Grab Current Tab</button>
        </div>

        <div class="theme-panel">
            <span>Theme:</span>
            <div class="theme-dot" style="background: #00ffcc;" onclick="setTheme('cyan')"></div>
            <div class="theme-dot" style="background: #ff0055;" onclick="setTheme('red')"></div>
            <div class="theme-dot" style="background: #39ff14;" onclick="setTheme('green')"></div>
        </div>
    </div>

    <div class="sidebar-links">
        <div class="sidebar-header">
            <h3>Saved Links</h3>
            <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search..." oninput="filterLinks()">
        </div>
        <div class="link-container" id="linkContainer"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
